name: datacheck
# Real-data path test: decrypt the encrypted puzzle bundle with the repo secret into the runner's temp dir, score a
# known file with our binary, encrypt the result, wipe the plaintext. Manual trigger only.
on:
  workflow_dispatch:
    inputs:
      chunks:
        description: JSON list of chunk ids (set by tools/st26_dispatch.py)
        default: "[0, 1]"
      max_parallel:
        description: parallel jobs (set by the dispatcher from the account-wide free slots)
        default: "2"

permissions:
  contents: read

# Santa policy (dynamic allocation): the dispatcher checks account-wide busy jobs (20-job limit shared with Google
# Quantum) and sets chunks/max_parallel; one Santa workflow at a time.
concurrency:
  group: st26-santa
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      max-parallel: ${{ fromJSON(github.event.inputs.max_parallel) }}
      matrix:
        chunk: ${{ fromJSON(github.event.inputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - name: Decrypt inputs
        env:
          ST26_DATA_KEY: ${{ secrets.ST26_DATA_KEY }}
        run: bash jobs/decrypt_inputs.sh
      - name: Check
        run: bash jobs/datacheck.sh "${{ matrix.chunk }}"
      - name: Wipe plaintext
        if: always()
        run: rm -rf "$RUNNER_TEMP/pz" work
      - uses: actions/upload-artifact@v4
        with:
          name: datacheck-${{ matrix.chunk }}
          path: out/result.cms
          retention-days: 1
          if-no-files-found: error
